name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit-tests:
    name: Unit tests (stack test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            hh200/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('hh200/stack.yaml', 'hh200/stack.yaml.lock', 'hh200/package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build
        working-directory: hh200
        run: stack build --test --no-run-tests

      - name: Run tests
        working-directory: hh200
        run: stack test
