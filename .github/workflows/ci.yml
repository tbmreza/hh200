name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (stack test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: '3'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            hh200/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('hh200/stack.yaml', 'hh200/stack.yaml.lock', 'hh200/package.yaml', 'hh200/hh200.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Build and run tests
        working-directory: hh200
        run: stack test
