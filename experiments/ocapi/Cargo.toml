[package]
name = "ocapi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rand = "0.9"
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
strip = true

[dev-dependencies]
proptest = "1.11.0"
