[package]
name = "ocapi"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["ocapi-core", "."]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
ocapi-core = { path = "ocapi-core" }
rand = "0.9"
serde_json = "1"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
strip = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.26.1", features = ["v4"] }
