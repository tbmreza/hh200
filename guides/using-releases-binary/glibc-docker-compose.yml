  hh200-debian-instance:
    image: debian:bookworm-slim
    user: root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../install.sh:/tmp/install.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null
        /bin/sh -x /tmp/install.sh
        /root/.local/bin/hh200 --version
        curl http://host.docker.internal:9999/api
        # curl http://php-dev-server:9999/api
